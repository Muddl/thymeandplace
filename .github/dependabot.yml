version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups: { gomod: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: docker
    directories: [/deploy, /deploy/backup, /pipeline/transform]
    schedule: { interval: weekly }
    groups: { docker: { patterns: ["*"] } }
    # A Postgres major needs dump/restore and a matching PostGIS image.
    # Do that as a planned upgrade, not a weekly grouped bump.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: { interval: weekly }
    groups: { docker-compose: { patterns: ["*"] } }
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: postgis/postgis
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /pipeline/transform
    schedule: { interval: weekly }
    groups: { pip: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"] } }
