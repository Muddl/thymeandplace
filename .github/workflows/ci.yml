name: ci
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Generated code is current
        run: |
          go tool templ generate
          ./scripts/sqlc.sh generate
          git diff --exit-code
      - run: go vet ./...
      - name: staticcheck
        run: go tool staticcheck ./...
      - name: govulncheck (reachable vulnerabilities only)
        run: go tool govulncheck ./...
      - name: Unit, scoring, auth, store integration and ingestion tests
        run: go test -race -count=1 ./...

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/transform/requirements-dev.txt
      - run: python -m pytest pipeline/tests -q

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose files are valid
        run: |
          # The production layout reads one env file per service; the
          # templates are enough for compose to resolve them (never real secrets).
          env_dir="$RUNNER_TEMP/env"
          mkdir -p "$env_dir"
          for f in deploy/env/*.env.example; do cp "$f" "$env_dir/$(basename "$f" .example)"; done
          # restore bind-mounts the restore-test key and refuses a missing file.
          touch "$env_dir/restore-test.agekey"
          TP_ENV_DIR="$env_dir" docker compose -f deploy/compose.yaml --profile tools config -q
          TP_ENV_DIR=./e2e docker compose -f deploy/compose.yaml -f deploy/compose.e2e.yaml --profile tools config -q
      - name: Release overlay resolves only with TP_IMAGE_TAG
        run: |
          env_dir="$RUNNER_TEMP/env"
          sha=0000000000000000000000000000000000000000
          cfg=$(TP_ENV_DIR="$env_dir" TP_IMAGE_TAG=$sha \
            docker compose -f deploy/compose.yaml -f deploy/compose.release.yaml --profile tools config --format json)
          # Every image comes from GHCR by SHA; nothing silently builds.
          if echo "$cfg" | jq -e '[.services[] | has("build")] | any' >/dev/null; then
            echo "compose.release.yaml must remove every build:"; exit 1
          fi
          expect() { # service, image name
            got=$(echo "$cfg" | jq -r --arg s "$1" '.services[$s].image')
            [ "$got" = "ghcr.io/muddl/thymeandplace-$2:$sha" ] || { echo "$1 resolves to '$got'"; exit 1; }
          }
          expect app app; expect migrate app; expect ingest ingest
          expect transform transform; expect backup backup; expect restore backup
          if err=$(TP_ENV_DIR="$env_dir" docker compose -f deploy/compose.yaml -f deploy/compose.release.yaml --profile tools config -q 2>&1); then
            echo "compose.release.yaml must fail without TP_IMAGE_TAG"; exit 1
          fi
          case "$err" in
            *TP_IMAGE_TAG*) ;;
            *) echo "compose.release.yaml failed for another reason: $err"; exit 1 ;;
          esac
      - name: deploy.sh refuses anything but a full SHA
        run: |
          for bad in "" main abc123 0000000000000000000000000000000000000000x; do
            rc=0; ./deploy/deploy.sh "$bad" 2>/dev/null || rc=$?
            [ "$rc" -eq 2 ] || { echo "deploy.sh exited $rc for '$bad', want 2"; exit 1; }
          done
      - name: No service gets another service's secrets
        run: |
          env_dir="$RUNNER_TEMP/env"
          cfg=$(TP_ENV_DIR="$env_dir" docker compose -f deploy/compose.yaml --profile tools config --format json)
          check() { # service, variable that must not be in its environment
            if echo "$cfg" | jq -e --arg s "$1" --arg v "$2" '.services[$s].environment | has($v)' >/dev/null; then
              echo "$1 must not get $2"; exit 1
            fi
          }
          for s in app migrate ingest backup restore; do check "$s" POSTGRES_PASSWORD; check "$s" TP_APP_PASSWORD; done
          for s in db migrate ingest backup restore; do check "$s" ADMIN_SECRET_KEY; done
          for s in db app migrate; do check "$s" BUCKET_SECRET_KEY; done
      - name: Build app image
        run: docker build -f deploy/Dockerfile.app .
      - name: Build ingest image
        run: docker build -f deploy/Dockerfile.ingest .
      - name: Build backup image
        run: docker build deploy/backup
      - name: Role bootstrap script parses
        run: bash -n deploy/db/initdb/20-roles.sh
      - name: Backup scripts parse
        # The image's scripts are POSIX sh (dash); verify.sh is bash.
        run: for f in deploy/backup/*.sh; do case "$f" in */verify.sh) bash -n "$f" ;; *) sh -n "$f" ;; esac; done
      - name: shellcheck
        # A pinned image, not the runner's apt shellcheck (0.9.x), so CI and
        # local runs report the same checks. -x follows the sourced heartbeat.sh.
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          -x deploy/*.sh deploy/backup/*.sh deploy/db/initdb/*.sh e2e/*.sh scripts/*.sh
      - name: e2e browser-selection self-test
        run: ./e2e/select-browsers.sh --self-test
      - name: e2e tag completeness
        run: node e2e/check-tags.mjs --self-test && node e2e/check-tags.mjs
      - name: e2e capture settings
        run: node e2e/check-capture.mjs

  e2e-select:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browsers: ${{ steps.select.outputs.browsers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}"
      - id: select
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          browsers=$(./e2e/select-browsers.sh)
          {
            echo "browsers<<EOF"
            echo "$browsers"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Selected browsers: $browsers" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: [go, python, e2e-select]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.e2e-select.outputs.browsers) }}
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: playwright-${{ matrix.browser }}-
      - name: Run e2e
        env:
          BROWSER: ${{ matrix.browser }}
          SHARD: ${{ matrix.shard }}/2
          CI: true
        run: ./e2e/run.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-blob-${{ matrix.browser }}-${{ matrix.shard }}
          path: e2e/blob-report
          if-no-files-found: ignore
          retention-days: 7

  e2e-report:
    if: failure() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: playwright-blob-*
          merge-multiple: true
          path: e2e/all-blob-reports
      - name: Merge Playwright reports
        working-directory: e2e
        run: |
          npm ci
          npx playwright merge-reports --reporter html all-blob-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  e2e-result:
    if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: e2e matrix must be green
        run: |
          result="${{ needs.e2e.result }}"
          echo "e2e matrix result: $result"
          [ "$result" = success ]

  backup:
    if: github.ref == 'refs/heads/main'
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Backup, encryption and restore recipe
        run: ./deploy/backup/verify.sh
