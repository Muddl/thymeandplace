# Resolves Playwright capture for a non-local origin. This workflow must
# not ship traces, screenshots, or videos off the runner.
name: e2e-remote-config
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-remote-config-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remote-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Capture is off for a non-local origin
        working-directory: e2e
        env:
          E2E_BASE_URL: https://example.com
          GREP: "@readonly"
          CI: true
        run: |
          node check-capture.mjs
          npm ci
          npx playwright test --project=chromium --grep @readonly --list
