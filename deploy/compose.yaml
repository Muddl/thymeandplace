name: thymeandplace

# Every service reads only its own env file from TP_ENV_DIR (default
# /etc/thymeandplace; the e2e stack uses ./e2e), so no container gets a secret
# it doesn't use. Templates: deploy/env/*.example. Database roles and which
# service uses which: docs/operations.md, "Database roles".

# Rotate container logs (Docker's json-file default grows without bound).
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

# One image serves both the app and its one-shot migration step.
x-app-build: &app-build
  build:
    context: ..
    dockerfile: deploy/Dockerfile.app
  image: thymeandplace-app:latest

services:
  db:
    <<: *logging
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    env_file: ${TP_ENV_DIR:-/etc/thymeandplace}/db.env
    volumes:
      - dbdata:/var/lib/postgresql/data
      # Runs once, on an empty data directory, after the image's 10_postgis.sh.
      - ./db/initdb/20-roles.sh:/docker-entrypoint-initdb.d/20-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  # Applies migrations as tp_owner, then exits. The app (tp_app) can't run
  # DDL and refuses to start while migrations are pending.
  migrate:
    <<: [*logging, *app-build]
    command: ["-migrate-only"]
    restart: "no"
    env_file: ${TP_ENV_DIR:-/etc/thymeandplace}/migrate.env
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: [*logging, *app-build]
    restart: unless-stopped
    env_file: ${TP_ENV_DIR:-/etc/thymeandplace}/app.env
    environment:
      ADDR: ":8080"
      TRUST_PROXY_HEADERS: "true"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  caddy:
    <<: *logging
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./maintenance.html:/srv/maintenance.html:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  ingest:
    <<: *logging
    profiles: [tools]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ingest
    image: thymeandplace-ingest:latest
    env_file: ${TP_ENV_DIR:-/etc/thymeandplace}/ingest.env
    environment:
      INGEST_WORKDIR: /work
    volumes:
      - ingest_work:/work
    depends_on:
      db:
        condition: service_healthy

  # Reads only the shared volume; no env file.
  transform:
    <<: *logging
    profiles: [tools]
    build:
      context: ../pipeline/transform
    image: thymeandplace-transform:latest
    volumes:
      - ingest_work:/work

  # Nightly pg_dump as tp_backup.
  backup:
    <<: *logging
    profiles: [tools]
    build:
      context: ./backup
    image: thymeandplace-backup:latest
    env_file: ${TP_ENV_DIR:-/etc/thymeandplace}/backup.env
    depends_on:
      db:
        condition: service_healthy

  # restore.sh and restore-test.sh, as the bootstrap superuser (dropping and
  # recreating the database needs it), kept apart from the nightly job so
  # the superuser password never reaches it.
  restore:
    <<: *logging
    profiles: [tools]
    build:
      context: ./backup
    image: thymeandplace-backup:latest
    entrypoint: ["/usr/local/bin/restore.sh"]
    env_file: ${TP_ENV_DIR:-/etc/thymeandplace}/restore.env
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata: {}
  caddy_data: {}
  caddy_config: {}
  ingest_work: {}
